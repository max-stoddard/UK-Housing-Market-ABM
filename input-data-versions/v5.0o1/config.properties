# Empirically input calibrated with FRS 2023-24 household data using scripts/python/calibration/frs/income_age_joint_dist.py
# Method: WAS-style weighted log annual gross non-rent household income by FRS age-bin joint distribution using gross4 weights
# Income filtering follows WAS: derive weekly gross_non_rent_income from hhinc minus sublet rent, treating SUBLET == 2 not-applicable SUBRENT as 0.0, then require positive derived income and apply 1% lower/upper tail trimming before log-bin selection
# Age source follows scripts/python/calibration/frs/age_dist.py: hhagegrp is preferred when populated, otherwise hhageGR4
# Reproduced via: python3 -m scripts.python.calibration.frs.income_age_joint_dist --output-dir <snapshot-dir> --evidence-dir <evidence-dir>
