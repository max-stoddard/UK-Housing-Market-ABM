# Method: weighted hhageGR4 histogram using gross4 after hhagegrp was anonymized as A in househol.csv;
# the source 75+ tail is split uniformly across 75-80, 80-85, and 85-95 for the model's 15-bin target
# Reproduced via: python3 -m scripts.python.calibration.frs.age_dist --output-dir <snapshot-dir> --evidence-dir <evidence-dir>
