# Empirically input calibrated on 2026-04-14 with BoE NMG Survey waves 2018-2024, diagnostic NMG waves 2015-2017 and
# 2025 split waves, and Land Registry Price Paid Data 2011, 2012, and 2018-2025 using national_cross_section +
