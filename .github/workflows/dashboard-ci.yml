# Author: Max Stoddard
name: Dashboard CI

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: AWS dashboard surface to deploy from master when cloud deployment is enabled.
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - api
          - source
      deploy_to_cloud:
        description: Set to true only when intentionally releasing the selected surface to AWS.
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - master
    paths:
      - .dockerignore
      - .github/aws/**
      - .github/workflows/dashboard-ci.yml
      - .mvn/**
      - dashboard/**
      - input-data-versions/**
      - mvnw
      - mvnw.cmd
      - pom.xml
      - scripts/**
      - src/**
  push:
    branches:
      - master
    paths:
      - .dockerignore
      - .github/aws/**
      - .github/workflows/dashboard-ci.yml
      - .mvn/**
      - dashboard/**
      - input-data-versions/**
      - mvnw
      - mvnw.cmd
      - pom.xml
      - scripts/**
      - src/**

concurrency:
  group: dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
  AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY || 'uk-housing-market-abm-api' }}
  AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
  AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
  AWS_ECS_CONTAINER_NAME: ${{ vars.AWS_ECS_CONTAINER_NAME || 'dashboard-api' }}
  AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET }}
  AWS_SOURCE_BUNDLE_PREFIX: ${{ vars.AWS_SOURCE_BUNDLE_PREFIX || 'tmp/github-actions/source' }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      api_changed: ${{ steps.classify.outputs.api_changed }}
      model_changed: ${{ steps.classify.outputs.model_changed }}
      source_bundle_changed: ${{ steps.classify.outputs.source_bundle_changed }}
      dashboard_checks_required: ${{ steps.classify.outputs.dashboard_checks_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        name: Classify changed paths
        run: |
          set -euo pipefail

          write_outputs() {
            echo "frontend_changed=$1" >> "$GITHUB_OUTPUT"
            echo "api_changed=$2" >> "$GITHUB_OUTPUT"
            echo "model_changed=$3" >> "$GITHUB_OUTPUT"
            echo "source_bundle_changed=$4" >> "$GITHUB_OUTPUT"
            echo "dashboard_checks_required=$5" >> "$GITHUB_OUTPUT"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.deploy_target }}" in
              all)
                write_outputs true true true true true
                ;;
              frontend)
                write_outputs true false false false true
                ;;
              api)
                write_outputs false true false false true
                ;;
              source)
                write_outputs false false true true false
                ;;
              *)
                echo "Unsupported deploy_target: ${{ inputs.deploy_target }}" >&2
                exit 1
                ;;
            esac
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
            AFTER="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git ls-tree -r --name-only "$AFTER")"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi

          printf '%s\n' "$CHANGED" > changed-paths.txt

          if grep -Eq '^(dashboard/src/|dashboard/shared/|dashboard/public/|dashboard/\.nvmrc$|dashboard/package\.json$|dashboard/package-lock\.json$|dashboard/vite\.config\.ts$|dashboard/tsconfig\.json$|dashboard/index\.html$)' changed-paths.txt; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(dashboard/Dockerfile\.api$|dashboard/server/|dashboard/shared/|dashboard/package\.json$|dashboard/package-lock\.json$|dashboard/tsconfig\.server\.json$|input-data-versions/|\.dockerignore$)' changed-paths.txt; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(src/|pom\.xml$|mvnw$|mvnw\.cmd$|\.mvn/)' changed-paths.txt; then
            echo "model_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "model_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(dashboard/server/|dashboard/shared/|dashboard/package\.json$|dashboard/package-lock\.json$|dashboard/tsconfig\.server\.json$|src/|scripts/|input-data-versions/|pom\.xml$|mvnw$|mvnw\.cmd$|\.mvn/)' changed-paths.txt; then
            echo "source_bundle_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_bundle_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(dashboard/|input-data-versions/|\.dockerignore$|\.github/workflows/dashboard-ci\.yml$|\.github/aws/)' changed-paths.txt; then
            echo "dashboard_checks_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashboard_checks_required=false" >> "$GITHUB_OUTPUT"
          fi

  dashboard-checks:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
    if: needs.classify-changes.outputs.dashboard_checks_required == 'true'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cloud experiment smoke preflight tests
        run: npm run test:cloud-experiment-smoke:unit

      - name: Smoke tests
        run: npm run test:smoke

  api-container-checks:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
    if: needs.classify-changes.outputs.api_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dashboard API container
        run: docker build --file dashboard/Dockerfile.api --tag uk-housing-model-dashboard-api:${{ github.sha }} .

  model-tests:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
    if: needs.classify-changes.outputs.model_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Maven tests
        run: ./mvnw test

  experiment-smoke-local:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
    if: |
      needs.classify-changes.outputs.dashboard_checks_required == 'true' ||
      needs.classify-changes.outputs.model_changed == 'true' ||
      needs.classify-changes.outputs.source_bundle_changed == 'true'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Local experiment smoke
        run: npm run test:experiment-smoke

  deploy-frontend:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - dashboard-checks
      - model-tests
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_to_cloud == true &&
      github.ref == 'refs/heads/master' &&
      needs.classify-changes.outputs.frontend_changed == 'true' &&
      needs.dashboard-checks.result == 'success' &&
      (needs.model-tests.result == 'success' || needs.model-tests.result == 'skipped')
    steps:
      - name: Validate AWS deployment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_FRONTEND_BUCKET"
          test -n "$AWS_CLOUDFRONT_DISTRIBUTION_ID"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci --include=dev

      - name: Build frontend
        working-directory: dashboard
        run: npm run build:client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend assets
        run: aws s3 sync dashboard/dist "s3://$AWS_FRONTEND_BUCKET/" --delete --region "$AWS_REGION"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          test -n "$INVALIDATION_ID"
          test "$INVALIDATION_ID" != "None"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

  deploy-api:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - dashboard-checks
      - api-container-checks
      - model-tests
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_to_cloud == true &&
      github.ref == 'refs/heads/master' &&
      needs.classify-changes.outputs.api_changed == 'true' &&
      needs.dashboard-checks.result == 'success' &&
      needs.api-container-checks.result == 'success' &&
      (needs.model-tests.result == 'success' || needs.model-tests.result == 'skipped')
    steps:
      - name: Validate AWS deployment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_ECR_REPOSITORY"
          test -n "$AWS_ECS_CLUSTER"
          test -n "$AWS_ECS_SERVICE"
          test -n "$AWS_ECS_CONTAINER_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="$ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --file dashboard/Dockerfile.api --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "api_image_tag=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "api_image_uri=$IMAGE" >> "$GITHUB_ENV"
          echo "ecr_registry=$ECR_REGISTRY" >> "$GITHUB_ENV"

      - name: Wait for clean ECR scan
        run: |
          set -euo pipefail
          aws ecr start-image-scan \
            --repository-name "$AWS_ECR_REPOSITORY" \
            --image-id "imageTag=$api_image_tag" \
            --region "$AWS_REGION" || true
          aws ecr wait image-scan-complete \
            --repository-name "$AWS_ECR_REPOSITORY" \
            --image-id "imageTag=$api_image_tag" \
            --region "$AWS_REGION"
          SCAN_JSON="$(aws ecr describe-image-scan-findings \
            --repository-name "$AWS_ECR_REPOSITORY" \
            --image-id "imageTag=$api_image_tag" \
            --region "$AWS_REGION")"
          CRITICAL="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<< "$SCAN_JSON")"
          HIGH="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<< "$SCAN_JSON")"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "ECR image scan found CRITICAL=$CRITICAL HIGH=$HIGH findings." >&2
            exit 1
          fi
          DIGEST="$(aws ecr describe-images \
            --repository-name "$AWS_ECR_REPOSITORY" \
            --image-ids "imageTag=$api_image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION")"
          test -n "$DIGEST"
          test "$DIGEST" != "None"
          echo "api_image_by_digest=$ecr_registry/$AWS_ECR_REPOSITORY@$DIGEST" >> "$GITHUB_ENV"

      - name: Register task definition revision
        run: |
          set -euo pipefail
          TASK_DEFINITION_ARN="$(aws ecs describe-services \
            --cluster "$AWS_ECS_CLUSTER" \
            --services "$AWS_ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            > /tmp/current-task-definition.json
          jq -e --arg CONTAINER "$AWS_ECS_CONTAINER_NAME" \
            '.taskDefinition.containerDefinitions[] | select(.name == $CONTAINER)' \
            /tmp/current-task-definition.json >/dev/null
          jq --arg IMAGE "$api_image_by_digest" --arg CONTAINER "$AWS_ECS_CONTAINER_NAME" '
            .taskDefinition
            | .containerDefinitions = (
                .containerDefinitions
                | map(if .name == $CONTAINER then .image = $IMAGE else . end)
              )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' /tmp/current-task-definition.json > /tmp/next-task-definition.json
          NEXT_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "next_task_definition_arn=$NEXT_TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: Update ECS service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$AWS_ECS_CLUSTER" \
            --service "$AWS_ECS_SERVICE" \
            --task-definition "$next_task_definition_arn"
          aws ecs wait services-stable \
            --cluster "$AWS_ECS_CLUSTER" \
            --services "$AWS_ECS_SERVICE"

  deploy-source-bundle:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - dashboard-checks
      - model-tests
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_to_cloud == true &&
      github.ref == 'refs/heads/master' &&
      needs.classify-changes.outputs.source_bundle_changed == 'true' &&
      (needs.dashboard-checks.result == 'success' || needs.dashboard-checks.result == 'skipped') &&
      (needs.model-tests.result == 'success' || needs.model-tests.result == 'skipped')
    steps:
      - name: Validate AWS deployment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_ARTIFACTS_BUCKET"
          test -n "$AWS_SOURCE_BUNDLE_PREFIX"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify private datasets are not tracked
        run: |
          set -euo pipefail
          if git ls-files 'private-datasets/**' | grep -q .; then
            echo "Tracked private-datasets files cannot be included in the source bundle." >&2
            exit 1
          fi

      - name: Create source bundle
        run: |
          set -euo pipefail
          git bundle create /tmp/uk-housing-model-source.bundle HEAD
          KEY="$AWS_SOURCE_BUNDLE_PREFIX/${GITHUB_SHA}.bundle"
          echo "source_bundle_key=$KEY" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload source bundle
        run: |
          set -euo pipefail
          aws s3 cp /tmp/uk-housing-model-source.bundle \
            "s3://$AWS_ARTIFACTS_BUCKET/$source_bundle_key" \
            --region "$AWS_REGION" \
            --metadata "git-sha=$GITHUB_SHA,git-ref=$GITHUB_REF_NAME,source-method=s3-git-bundle"

      - name: Write current source deploy manifest
        run: |
          set -euo pipefail
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg bucket "$AWS_ARTIFACTS_BUCKET" \
            --arg bundleKey "$source_bundle_key" \
            --arg createdAt "$CREATED_AT" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{
              schemaVersion: 1,
              sourceMethod: "s3-git-bundle",
              commit: $commit,
              ref: $ref,
              repository: $repository,
              bundleBucket: $bucket,
              bundleKey: $bundleKey,
              createdAt: $createdAt,
              workflowRunId: $workflowRunId
            }' > /tmp/current-deploy.json
          aws s3 cp /tmp/current-deploy.json \
            "s3://$AWS_ARTIFACTS_BUCKET/$AWS_SOURCE_BUNDLE_PREFIX/current-deploy.json" \
            --content-type application/json \
            --region "$AWS_REGION" \
            --metadata "git-sha=$GITHUB_SHA,git-ref=$GITHUB_REF_NAME,source-method=s3-git-bundle"

  cloud-experiment-smoke:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - dashboard-checks
      - model-tests
      - experiment-smoke-local
      - deploy-frontend
      - deploy-api
      - deploy-source-bundle
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_to_cloud == true &&
      github.ref == 'refs/heads/master' &&
      (needs.dashboard-checks.result == 'success' || needs.dashboard-checks.result == 'skipped') &&
      (needs.model-tests.result == 'success' || needs.model-tests.result == 'skipped') &&
      (needs.experiment-smoke-local.result == 'success' || needs.experiment-smoke-local.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-source-bundle.result == 'success' || needs.deploy-source-bundle.result == 'skipped')
    defaults:
      run:
        working-directory: dashboard
    env:
      DASHBOARD_CLOUD_SMOKE_BASE_URL: ${{ vars.DASHBOARD_CLOUD_SMOKE_BASE_URL || 'https://d2fb77ex4myvdf.cloudfront.net' }}
      DASHBOARD_SMOKE_USERNAME: ${{ secrets.DASHBOARD_SMOKE_USERNAME }}
      DASHBOARD_SMOKE_PASSWORD: ${{ secrets.DASHBOARD_SMOKE_PASSWORD }}
      DASHBOARD_SMOKE_DELETE_KEY: ${{ secrets.DASHBOARD_SMOKE_DELETE_KEY }}
      DASHBOARD_CLOUD_SMOKE_WARN_ON_STOPPED_RUNNER: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Cloud experiment smoke
        run: npm run test:cloud-experiment-smoke
